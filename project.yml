name: CoinBriefAI
options:
  bundleIdPrefix: com.CoinBriefAI
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    DEVELOPMENT_TEAM: ""
targets:
  CoinBriefAI:
    type: application
    platform: iOS
    sources:
      - path: CoinBriefAI
        excludes:
          - Resources/Info.plist
    resources:
      - path: CoinBriefAI/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.CoinBriefAI.app
        PRODUCT_NAME: CoinBriefAI
        INFOPLIST_FILE: CoinBriefAI/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoinBriefAI/CoinBriefAI.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: CoinBriefAIWidget
        embed: true
  CoinBriefAIWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: CoinBriefAIWidget
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.CoinBriefAI.app.widget
        PRODUCT_NAME: CoinBriefAIWidget
        INFOPLIST_FILE: CoinBriefAIWidget/Info.plist
        CODE_SIGN_ENTITLEMENTS: CoinBriefAIWidget/CoinBriefAIWidget.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
  CoinBriefAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - CoinBriefAITests
    dependencies:
      - target: CoinBriefAI
  CoinBriefAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - CoinBriefAIUITests
    dependencies:
      - target: CoinBriefAI
